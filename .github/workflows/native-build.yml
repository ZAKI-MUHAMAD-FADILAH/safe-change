name: Native Module CI and Distribution

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64-gnu
            pkg_name: "@safe-change/linux-x64-gnu"
          - os: windows-latest
            target: win32-x64-msvc
            pkg_name: "@safe-change/win32-x64-msvc"
          - os: macos-latest
            target: darwin-arm64
            pkg_name: "@safe-change/darwin-arm64"
          - os: macos-15-intel
            target: darwin-x64
            pkg_name: "@safe-change/darwin-x64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@safe-change.local"
          git config --global user.name "CI Runner"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 20.x
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify TypeScript fallback without native binary
        run: npm test
        env:
          SAFE_CHANGE_NATIVE_DISABLED: "1"

      - name: Run Rust unit tests
        run: |
          cd crates/safe-change-native
          cargo test
        shell: bash

      - name: Build Native Module for ${{ matrix.target }}
        run: |
          cd crates/safe-change-native
          npx napi build --platform --release
        shell: bash

      - name: Verify generated native binary exists
        run: |
          ls -la crates/safe-change-native/*.node
        shell: bash

      - name: Verify native module load and execution
        run: |
          node scripts/verify-built-native.mjs ${{ matrix.target }}
          npx vitest run tests/native/
        shell: bash

      - name: Upload native artifact for ${{ matrix.target }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: native-binary-${{ matrix.target }}
          path: crates/safe-change-native/*.node
          if-no-files-found: error
