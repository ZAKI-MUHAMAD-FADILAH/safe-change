name: Native Module CI and Distribution

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64-gnu
            pkg_name: "@safe-change/linux-x64-gnu"
          - os: windows-latest
            target: win32-x64-msvc
            pkg_name: "@safe-change/win32-x64-msvc"
          - os: macos-latest
            target: darwin-arm64
            pkg_name: "@safe-change/darwin-arm64"
          - os: macos-15-intel
            target: darwin-x64
            pkg_name: "@safe-change/darwin-x64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@safe-change.local"
          git config --global user.name "CI Runner"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 20.x
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e752f9b88cf4da61b07241285223c6c06a374668 # stable

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify TypeScript fallback without native binary
        run: npm test
        env:
          SAFE_CHANGE_NATIVE_DISABLED: "1"

      - name: Run Rust unit tests
        run: |
          cd crates/safe-change-native
          cargo test
        shell: bash

      - name: Build Native Module for ${{ matrix.target }}
        run: |
          cd crates/safe-change-native
          npx napi build --platform --release
        shell: bash

      - name: Verify generated native binary exists
        run: |
          ls -la crates/safe-change-native/*.node
        shell: bash

      - name: Verify native module load and execution
        run: |
          node scripts/verify-built-native.mjs ${{ matrix.target }}
          npx vitest run tests/native/
        shell: bash

      - name: Upload native artifact for ${{ matrix.target }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: native-binary-${{ matrix.target }}
          path: crates/safe-change-native/*.node
          if-no-files-found: error

  publish-native:
    name: Publish Native Platform Packages
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"

      - name: Download all native artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts

      - name: Copy binaries to corresponding platform packages
        run: |
          for target in linux-x64-gnu win32-x64-msvc darwin-arm64 darwin-x64; do
            artifact_dir="artifacts/native-binary-${target}"
            target_pkg_dir="npm/${target}"
            if [ ! -d "$artifact_dir" ]; then
              echo "Error: Required artifact directory $artifact_dir is missing!"
              exit 1
            fi
            binary_file=$(find "$artifact_dir" -name "*.node" | head -n 1)
            if [ -z "$binary_file" ] || [ ! -f "$binary_file" ]; then
              echo "Error: Native binary for target $target not found in $artifact_dir!"
              exit 1
            fi
            mkdir -p "$target_pkg_dir"
            cp "$binary_file" "$target_pkg_dir/safe-change-native.node"
            echo "Installed native binary to $target_pkg_dir"
          done
        shell: bash

      - name: Publish verified platform packages
        run: |
          for target in linux-x64-gnu win32-x64-msvc darwin-arm64 darwin-x64; do
            pkg_dir="npm/${target}"
            if [ ! -f "$pkg_dir/safe-change-native.node" ]; then
              echo "Error: Missing binary in $pkg_dir before publish"
              exit 1
            fi
            echo "Publishing package $pkg_dir..."
            npm publish "$pkg_dir" --access public --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
